server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        proxy_pass http://api:18865;
        proxy_set_header Host $http_host;
        proxy_read_timeout 150s;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
}
