server:
  address: ${API_HOST:127.0.0.1}
  port: ${API_PORT:18865}
  tomcat:
    max-http-form-post-size: 512KB
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/schedule}
    username: ${DB_USER:schedule}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
schedule:
  secure-cookie: ${SCHEDULE_SECURE_COOKIE:false}
  allowed-origins: ${ALLOWED_ORIGINS:http://127.0.0.1:8765,http://localhost:8765,http://127.0.0.1:8876,http://localhost:8876}
  import-source: ${IMPORT_SOURCE:}
  ai:
    key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4.1-mini}
    encryption-key: ${AI_CONFIG_MASTER_KEY:}
    encryption-key-file: ${AI_CONFIG_KEY_FILE:.runtime/secrets/model-config.key}
