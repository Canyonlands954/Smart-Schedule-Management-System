services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/schedule
      DB_USER: schedule
      DB_PASSWORD: ${DB_PASSWORD:?Configure .env}
      API_HOST: 0.0.0.0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8765,http://localhost:8765}
      SCHEDULE_SECURE_COOKIE: ${SCHEDULE_SECURE_COOKIE:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_CONFIG_MASTER_KEY: ${AI_CONFIG_MASTER_KEY:-}
      AI_CONFIG_KEY_FILE: /app/secrets/model-config.key
      KNOWLEDGE_DIRECTORY: /app/knowledge
    volumes:
      - model_secrets:/app/secrets
      - knowledge_files:/app/knowledge
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:80"
    depends_on:
      - api
volumes:
  model_secrets:
  knowledge_files:
